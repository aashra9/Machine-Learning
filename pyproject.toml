[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-notes-companions"
version = "0.1.0"
description = "Runnable Python companions for the machine learning lecture notes"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "sympy>=1.12",
    "pillow>=10.0",
    "jupyter>=1.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "nbformat>=5.9"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["Code"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
