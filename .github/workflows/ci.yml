name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check Code tests
      - name: No unfinished notes
        run: "! grep -n '\\\\todo' Lecture-Notes/Lectures/Lectures.tex"
      - name: Test
        run: python -m pytest

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science texlive-pictures \
            texlive-bibtex-extra biber latexmk
      - name: Compile lecture notes
        working-directory: Lecture-Notes/Lectures
        run: latexmk -pdf -interaction=nonstopmode Lectures.tex
