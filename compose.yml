services:
  opencode:
    image: ghcr.io/anomalyco/opencode:latest
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - opencode_data:/root/.local/share/opencode

  kilo:
    image: node:22-slim
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - ~/.config/kilo:/root/.config/kilo
    entrypoint: ["npx", "-y", "@kilocode/cli"]

volumes:
  opencode_data: